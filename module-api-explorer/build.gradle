dependencies {
    api platform(libs.spring.boot.dependencies)

    api project(":core")
    // the OpenAPI parser, spec registry and swagger model all come from here —
    // this module never parses a document itself
    api project(":module-api-discovery")
    // the HTTP client, its filters and its redaction — no second client
    api project(":module-http")
    // the access matrix switches roles through AuthContext; the module is inert unless forge.auth is enabled
    api project(":module-auth")
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "com.fasterxml.jackson.core:jackson-databind"
    // StubContractChecker reads WireMock stub definitions; present wherever module-mock is
    compileOnly libs.wiremock

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation libs.wiremock
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
