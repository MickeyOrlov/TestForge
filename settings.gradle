plugins {
    // auto-provisions the toolchain JDK on machines/CI that don't have it
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "testforge"

include "core",
        "module-contract",
        "module-contract-monitor",
        "module-api-discovery",
        "module-api-codegen",
        "module-api-explorer",
        "module-api-fuzz",
        "module-data",
        "module-db",
        "module-db-contract",
        "module-flow",
        "module-state",
        "module-http",
        "module-auth",
        "module-kafka",
        "module-rabbitmq",
        "module-gherkin",
        "module-reporting",
        "module-security",
        "module-mock",
        "module-web",
        "module-web-playwright",
        "module-mobile-appium",
        "example-tests",
        "architecture-tests"
