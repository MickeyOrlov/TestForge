// Executable form of the rules in AGENTS.md. Never published: it only reads the
// compiled main classes of every production module.
def productionModules = rootProject.subprojects.findAll {
    it.name == "core" || it.name.startsWith("module-")
}

dependencies {
    testImplementation platform(libs.spring.boot.dependencies)

    productionModules.each { testImplementation project(it.path) }

    testImplementation libs.archunit
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    // lets the file-level rules (README, example coverage) find the repository
    systemProperty "testforge.root", rootProject.projectDir.absolutePath
    systemProperty "testforge.modules", productionModules.collect { it.name }.sort().join(",")

    // the file-level rules read these directly; without declaring them Gradle
    // would report the task UP-TO-DATE after a README or test was deleted
    inputs.files(productionModules.collect { m ->
        ["README.md", "AGENTS.md", "build.gradle"].collect { m.file(it) } + [m.file("src/test")]
    }.flatten() + [rootProject.file("example-tests/src/test")])
            .withPropertyName("moduleSourcesAndDocs")
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
