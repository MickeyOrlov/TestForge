dependencies {
    api platform(libs.spring.boot.dependencies)

    api project(":core")
    api project(":module-api-discovery")
    // External CLI performs all HTTP traffic in its own process, so this module
    // needs no JVM HTTP client, and modules must stay independently deletable.
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "com.fasterxml.jackson.core:jackson-databind"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform {
        excludeTags "schemathesis"
    }
}

tasks.register("schemathesisTest", Test) {
    description = "Runs API fuzz acceptance tests using real Schemathesis CLI"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "schemathesis"
    }
    shouldRunAfter tasks.named("test")
}

