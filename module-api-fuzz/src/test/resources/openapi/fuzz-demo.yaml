openapi: 3.0.3
info:
  title: Fuzz Demo API
  version: 1.0.0
paths:
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 8
            pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /search:
    get:
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: integer
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, age, profile]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 10
                age:
                  type: integer
                  minimum: 18
                  maximum: 120
                nickname:
                  type: string
                active:
                  type: boolean
                role:
                  type: string
                  enum: [admin, user]
                note:
                  type: string
                  nullable: true
                tags:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                payment:
                  oneOf:
                    - type: object
                      properties:
                        card:
                          type: string
                    - type: object
                      properties:
                        iban:
                          type: string
                profile:
                  type: object
                  required: [city, locale]
                  properties:
                    locale:
                      type: string
                    city:
                      type: string
                      minLength: 2
                    score:
                      type: number
                      minimum: 0
                      exclusiveMinimum: true
                      multipleOf: 5
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /impossible:
    post:
      operationId: impossibleBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{4}-[A-Z]{3}$'
      responses:
        '201':
          description: Created
  /xml-only:
    post:
      operationId: xmlOnlyBody
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
      responses:
        '201':
          description: Created
  /either:
    post:
      operationId: eitherBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    card:
                      type: string
                - type: object
                  properties:
                    iban:
                      type: string
      responses:
        '201':
          description: Created
  /reports:
    get:
      operationId: listReports
      parameters:
        # single-valued wire form: style form + explode false joins with commas
        - name: status
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 3
            uniqueItems: true
            items:
              type: string
              enum: [open, closed, archived]
        # the OpenAPI default for a query array — repeats the name per element,
        # which a one-value-per-name request model cannot express
        - name: owner
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              since:
                type: string
      responses:
        '200':
          description: OK
  /accounts:
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner, labels]
              properties:
                id:
                  type: string
                  readOnly: true
                owner:
                  type: string
                  minLength: 2
                labels:
                  type: array
                  minItems: 2
                  maxItems: 4
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 3
                method:
                  discriminator:
                    propertyName: kind
                  oneOf:
                    - type: object
                      required: [kind, card]
                      properties:
                        kind:
                          type: string
                          enum: [card]
                        card:
                          type: string
                          minLength: 4
                    - type: object
                      required: [kind, iban]
                      properties:
                        kind:
                          type: string
                          enum: [iban]
                        iban:
                          type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
