dependencies {
    api platform(libs.spring.boot.dependencies)
    api project(":core")
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "com.fasterxml.jackson.core:jackson-databind"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation libs.json.schema.validator
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register("securityAudit", JavaExec) {
    group = "verification"
    description = "Explicit file-output audit plan/run command; no scanner adapters bundled yet"
    dependsOn tasks.named("classes")
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "io.testforge.security.audit.SecurityAuditCli"
    doFirst {
        def profile = providers.gradleProperty("auditProfile").orNull
        def output = providers.gradleProperty("auditOutput").orNull
        if (!profile || !output) throw new GradleException("auditProfile and auditOutput are required")
        args = [providers.gradleProperty("auditCommand").getOrElse("plan"),
                "--profile", project.file(profile).absolutePath, "--output", project.file(output).absolutePath]
        if (providers.gradleProperty("auditRun").getOrElse("false") == "true") args += "--enable-run"
    }
}
