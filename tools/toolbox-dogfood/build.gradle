plugins { id 'java' }
repositories {
    maven { url = uri('../../build/test-maven-repository') }
    mavenCentral()
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.5.15')
    testImplementation 'io.testforge:module-faults:1.3.0-SNAPSHOT'
    testImplementation 'io.testforge:module-a11y:1.3.0-SNAPSHOT'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    testLogging { events 'passed','failed'; exceptionFormat='full' }
    outputs.upToDateWhen { false }
    doFirst {
        def jar = providers.gradleProperty('petclinicJar').orNull
        if (!jar || !file(jar).isFile()) throw new GradleException('Select an existing Petclinic JAR with -PpetclinicJar=/absolute/path')
        systemProperty 'petclinic.jar', file(jar).absolutePath
    }
    systemProperty 'dogfood.output', layout.buildDirectory.dir('evidence').get().asFile.absolutePath
}
