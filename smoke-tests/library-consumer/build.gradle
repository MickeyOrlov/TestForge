plugins {
    id "java"
}

group = "io.testforge.smoke"
version = "1.0.0"

def testforgeRepositoryUri = uri(providers.gradleProperty("testforgeRepositoryUrl")
        .orElse(rootProject.file("../../build/test-maven-repository").toURI().toString())
        .get())
def testforgeRepositoryUsername = providers.gradleProperty("testforgeRepositoryUsername")
        .orElse(providers.environmentVariable("TESTFORGE_REPOSITORY_USERNAME"))
        .orElse(providers.environmentVariable("GITHUB_ACTOR"))
def testforgeRepositoryPassword = providers.gradleProperty("testforgeRepositoryPassword")
        .orElse(providers.environmentVariable("TESTFORGE_REPOSITORY_PASSWORD"))
        .orElse(providers.environmentVariable("GITHUB_TOKEN"))

repositories {
    maven {
        name = "testForgeTestRepository"
        url = testforgeRepositoryUri
        if (testforgeRepositoryUri.scheme in ["http", "https"]) {
            credentials {
                username = testforgeRepositoryUsername.getOrNull()
                password = testforgeRepositoryPassword.getOrNull()
            }
        }
    }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def testforgeVersion = providers.gradleProperty("testforgeVersion")
        .orElse(libs.versions.testforge)
        .get()
def testforgeGroup = providers.gradleProperty("testforgeGroup")
        .orElse("io.testforge")
        .get()

dependencies {
    testImplementation "${testforgeGroup}:module-http:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-discovery:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-codegen:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-explorer:${testforgeVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${libs.versions.spring.boot.get()}"
    testImplementation libs.wiremock
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}
