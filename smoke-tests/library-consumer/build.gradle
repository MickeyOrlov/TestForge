plugins {
    id "java"
}

group = "io.testforge.smoke"
version = "1.0.0"

def testforgeRepositoryUri = uri(providers.gradleProperty("testforgeRepositoryUrl")
        .orElse(rootProject.file("../../build/test-maven-repository").toURI().toString())
        .get())
def testforgeRepositoryUsername = providers.gradleProperty("testforgeRepositoryUsername")
        .orElse(providers.environmentVariable("TESTFORGE_REPOSITORY_USERNAME"))
        .orElse(providers.environmentVariable("GITHUB_ACTOR"))
def testforgeRepositoryPassword = providers.gradleProperty("testforgeRepositoryPassword")
        .orElse(providers.environmentVariable("TESTFORGE_REPOSITORY_PASSWORD"))
        .orElse(providers.environmentVariable("GITHUB_TOKEN"))

repositories {
    maven {
        name = "testForgeTestRepository"
        url = testforgeRepositoryUri
        if (testforgeRepositoryUri.scheme in ["http", "https"]) {
            credentials {
                username = testforgeRepositoryUsername.getOrNull()
                password = testforgeRepositoryPassword.getOrNull()
            }
        }
    }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def testforgeVersion = providers.gradleProperty("testforgeVersion")
        .orElse(libs.versions.testforge)
        .get()
def testforgeGroup = providers.gradleProperty("testforgeGroup")
        .orElse("io.testforge")
        .get()

dependencies {
    testImplementation "${testforgeGroup}:module-http:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-auth:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-security:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-security-audit:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-discovery:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-codegen:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-explorer:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-api-fuzz:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-reporting:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-db:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-db-contract:${testforgeVersion}"
    testImplementation "${testforgeGroup}:module-rabbitmq:${testforgeVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc:${libs.versions.spring.boot.get()}"
    testRuntimeOnly "com.h2database:h2:2.3.232"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${libs.versions.spring.boot.get()}"
    testImplementation libs.wiremock
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

// Prove the audit file-contract bridge does not require the original security/http/auth modules.
configurations {
    securityAuditStandalone {
        canBeResolved = true
        canBeConsumed = false
    }
}
dependencies {
    securityAuditStandalone platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}")
    securityAuditStandalone "${testforgeGroup}:module-security-audit:${testforgeVersion}"
    securityAuditStandalone "org.springframework.boot:spring-boot-starter-test:${libs.versions.spring.boot.get()}"
    securityAuditStandalone "org.junit.platform:junit-platform-launcher"
}
tasks.register("securityAuditStandaloneTest", Test) {
    group = "verification"
    description = "Audit profile/import/report API from published JARs without other TestForge modules"
    dependsOn tasks.named("testClasses")
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(sourceSets.test.output, configurations.securityAuditStandalone)
    include "**/PublishedSecurityAuditSmokeTest.class"
    useJUnitPlatform()
    systemProperty "audit.standalone", "true"
    testLogging { events "passed", "failed"; exceptionFormat = "full" }
}
