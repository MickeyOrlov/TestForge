plugins {
    alias(libs.plugins.spotless) apply false
    id "jacoco-report-aggregation"
}

allprojects {
    group = "io.testforge"
    version = "1.2.0-SNAPSHOT"

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "checkstyle"
    apply plugin: "jacoco"
    apply plugin: "com.diffplug.spotless"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        configFile = rootProject.file("config/checkstyle/checkstyle.xml")
        maxWarnings = 0
    }

    spotless {
        java {
            importOrder("java", "javax", "jakarta", "", "\\#")
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty "file.encoding", "UTF-8"

        // -DtestEnv=<name> on the Gradle command line selects the Spring profile
        // inside forked test JVMs (Gradle does not forward system properties)
        String testEnv = System.getProperty("testEnv")
        if (testEnv != null) {
            systemProperty "spring.profiles.active", testEnv
        }

        // -Dforge.playwright.browser-type=<browser> drives the CI browser matrix
        String browserType = System.getProperty("forge.playwright.browser-type")
        if (browserType != null) {
            systemProperty "forge.playwright.browser-type", browserType
        }

        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat = "full"
        }
    }

    tasks.named("test") {
        finalizedBy tasks.named("jacocoTestReport")
    }

    tasks.named("jacocoTestReport") {
        reports {
            xml.required = true
            html.required = true
        }
    }
}

// one merged coverage report over every module, fed by all subproject test runs
// (the example suite exercises module code, so its run counts toward module coverage)
reporting {
    reports {
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = "test"
        }
    }
}

dependencies {
    subprojects.forEach { jacocoAggregation it }
}
