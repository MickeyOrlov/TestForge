dependencies {
    api platform(libs.spring.boot.dependencies)
    api platform(libs.cucumber.bom)

    api project(":core")
    api "org.springframework.boot:spring-boot-autoconfigure"
    api "io.cucumber:cucumber-java"
    // runs step classes as Spring beans of the project's test context
    api "io.cucumber:cucumber-spring"
    api "com.fasterxml.jackson.core:jackson-databind"

    // glue per adapter: a project lists only the step packages whose module it has
    compileOnly project(":module-http")
    compileOnly project(":module-kafka")
    compileOnly project(":module-rabbitmq")
}

dependencies {
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation project(":module-http")
    testImplementation project(":module-kafka")
    testImplementation project(":module-rabbitmq")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
