// Optional external inventory. The default build never installs or invokes the native tools.
def toolDir = rootProject.file("tools/external-surface")

tasks.register("externalSurface", Exec) {
    description = "Inventories a selected domain and explicitly approved web origins"
    group = "verification"
    workingDir rootProject.projectDir
    doFirst {
        def scope = providers.gradleProperty("surfaceScope").orNull
        def tools = providers.gradleProperty("surfaceToolsDir").orNull
        if (!scope || !tools || !new File(tools).isAbsolute()) {
            throw new GradleException("Select -PsurfaceScope=scope.json and -PsurfaceToolsDir=/absolute/path")
        }
        commandLine "node", new File(toolDir, "run.mjs"), rootProject.file(scope), tools,
                rootProject.layout.buildDirectory.dir("external-surface").get().asFile
    }
}

tasks.register("externalSurfaceTest", Exec) {
    description = "Checks external inventory contracts without scanning a service"
    group = "verification"
    workingDir toolDir
    commandLine "node", "--test", "run.test.mjs"
}

tasks.register("externalSurfaceAcceptance", Exec) {
    description = "Runs native httpx and Katana against an owned loopback fixture"
    group = "verification"
    workingDir toolDir
    doFirst {
        def tools = providers.gradleProperty("surfaceToolsDir").orNull
        if (!tools || !new File(tools).isAbsolute()) {
            throw new GradleException("Select -PsurfaceToolsDir=/absolute/path")
        }
        commandLine "node", "acceptance.mjs", tools
    }
}
