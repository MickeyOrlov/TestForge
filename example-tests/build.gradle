plugins {
    // -PtestRetries=N reruns a failed test; one that passes on a rerun is reported flaky (module-quality)
    id "org.gradle.test-retry" version "1.6.6"
}

dependencies {
    testImplementation platform(libs.spring.boot.dependencies)

    testImplementation project(":core")
    testImplementation project(":module-security")
    testImplementation project(":module-contract")
    testImplementation project(":module-contract-monitor")
    testImplementation project(":module-api-discovery")
    testImplementation project(":module-api-codegen")
    testImplementation project(":module-api-explorer")
    testImplementation project(":module-api-fuzz")
    testImplementation project(":module-data")
    testImplementation project(":module-db")
    testImplementation project(":module-db-contract")
    testImplementation project(":module-flow")
    testImplementation project(":module-state")
    testImplementation project(":module-http")
    testImplementation project(":module-load")
    testImplementation project(":module-mail")
    testImplementation project(":module-a11y")
    testImplementation project(":module-faults")
    testImplementation project(":module-auth")
    testImplementation project(":module-kafka")
    testImplementation project(":module-rabbitmq")
    testImplementation project(":module-gherkin")
    // feature files run as a JUnit Platform suite (GherkinExampleSuite)
    testImplementation platform(libs.cucumber.bom)
    testImplementation "io.cucumber:cucumber-junit-platform-engine"
    testImplementation "org.junit.platform:junit-platform-suite"
    testImplementation project(":module-mock")
    testImplementation project(":module-reporting")
    testImplementation project(":module-quality")
    testImplementation project(":module-web")

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa"
    // an adapted project starts its service under test next to the modules (ApplicationIsolationTest)
    testImplementation "org.springframework.boot:spring-boot-starter-web"
    testImplementation libs.rest.assured

    testRuntimeOnly "com.h2database:h2"
    // runs a fixture that leaves data behind on purpose (LeftoverReportExampleTest)
    testImplementation "org.junit.platform:junit-platform-testkit"
    // Gradle 9 no longer injects the launcher onto the test runtime classpath
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // embedded broker for the collector integration test; Spring Boot's
    // KafkaAutoConfiguration creates the ConsumerFactory when spring-kafka is present
    testImplementation "org.springframework.kafka:spring-kafka-test"

    // container-backed tests (tag "containers", excluded from default build)
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation libs.testcontainers.toxiproxy
    testImplementation libs.toxiproxy.java
    testImplementation libs.testcontainers.kafka
    testImplementation "org.springframework.boot:spring-boot-starter-mail"
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.rabbitmq
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly "org.postgresql:postgresql"

    // Allure decorator/attachment examples (optional deps of the modules)
    testImplementation libs.allure.java.commons
    testImplementation libs.allure.junit5

    // UI/mobile module examples
    testImplementation project(":module-web-playwright")
    testImplementation project(":module-mobile-appium")
}

// off unless asked for: a rerun hides a failure from the build, so it must also reach the quality gate,
// which counts a test that failed and then passed as flaky. The build stays green on such a test.
def testRetries = providers.gradleProperty("testRetries").map { it as int }.orElse(0)
tasks.withType(Test).configureEach {
    if (name != "qualityGate") {
        retry {
            maxRetries = testRetries
            failOnPassedAfterRetry = false
        }
    }
}

// container/browser tests need Docker/a browser binary — keep the default build offline
test {
    useJUnitPlatform {
        excludeTags "containers", "mail", "testssl", "nuclei", "browser", "live-api", "quality-gate", "load", "api-load-research"
    }
    // fixtures run only through EngineTestKit (they fail on purpose)
    exclude "**/*TestkitFixture*"
}

tasks.register("containersTest", Test) {
    description = "Container-backed integration tests (requires a running Docker daemon)"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "containers"
    }
    shouldRunAfter tasks.named("test")
}

// The quality gate of a finished run (module-quality): a CI step after the test tasks.
//   ./gradlew :example-tests:test :example-tests:containersTest :example-tests:qualityGate
//   -PqualityRunIds=<run>,<run>   run indexes of the test JVMs (default: the newest)
//   -PqualityBaseline=<file>      the accepted run's quality-baseline.json
//   -PqualityResultsNotBefore=<instant>  drop JUnit results older than this (default: this build's
//                                        start, when the test tasks run in the same build)
//   -PqualityHistory=<dir>        the last runs (restore it from the CI cache before, save it after);
//   -PqualityRevision=<commit>    the code tested, when the CI exposes no GITHUB_SHA / CI_COMMIT_SHA / GIT_COMMIT
tasks.register("qualityGate", Test) {
    description = "Judges the finished test run and fails on new quality issues (module-quality)"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "quality-gate"
    }
    mustRunAfter tasks.named("test"), tasks.named("containersTest")
    def results = [tasks.named("test"), tasks.named("containersTest")].collect {
        it.get().reports.junitXml.outputLocation.get().asFile.absolutePath
    }
    systemProperty "forge.quality.enabled", "true"
    // the gate's own JVM writes a run index too: under the tests' run id (one CI job id for both
    // steps) it would replace that run's manifest.json with its own two reports when it closes
    systemProperty "forge.reporting.artifacts.run-id", "quality-gate"
    systemProperty "forge.quality.junit-results", results.join(",")
    systemProperty "forge.quality.output-dir", layout.buildDirectory.dir("quality").get().asFile.absolutePath
    // results older than this build belong to a test task that did not run in it — known only when the
    // test tasks are in the same build; a separate CI step passes -PqualityResultsNotBefore=<instant>
    def buildStarted = java.time.Instant.now().toString()
    def gate = it
    gradle.taskGraph.whenReady { graph ->
        def notBefore = providers.gradleProperty("qualityResultsNotBefore").getOrNull()
        if (notBefore == null && [":example-tests:test", ":example-tests:containersTest"].any { graph.hasTask(it) }) {
            notBefore = buildStarted
        }
        if (notBefore != null) {
            gate.systemProperty "forge.quality.results-not-before", notBefore
        }
    }
    if (providers.gradleProperty("qualityRunIds").isPresent()) {
        systemProperty "forge.quality.run-id", providers.gradleProperty("qualityRunIds").get()
    }
    if (providers.gradleProperty("qualityBaseline").isPresent()) {
        systemProperty "forge.quality.baseline-file", providers.gradleProperty("qualityBaseline").get()
    }
    if (providers.gradleProperty("qualityHistory").isPresent()) {
        systemProperty "forge.quality.history.dir", providers.gradleProperty("qualityHistory").get()
    }
    if (providers.gradleProperty("qualityRevision").isPresent()) {
        systemProperty "forge.quality.history.revision", providers.gradleProperty("qualityRevision").get()
    }
    // the run to judge changes every time; there is nothing to be up to date with
    outputs.upToDateWhen { false }
}

tasks.register("browsersTest", Test) {
    description = "Browser-backed UI examples (run :module-web-playwright:playwrightInstall first)"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "browser"
    }
    shouldRunAfter tasks.named("test")
}

tasks.register("liveApiTest", Test) {
    description = "Explores a public live API (needs network and TESTFORGE_LIVE_API_BASE_URL)"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "live-api"
    }
    shouldRunAfter tasks.named("test")
}

// ZAP acceptance uses Jupiter only; unrelated Cucumber suites have no security
// container scenarios and must not be discovered as empty tagged suites here.
tasks.register("securityScanTest", Test) {
    description = "Runs the pinned ZAP container against an owned local sample"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines "junit-jupiter"
        includeTags "containers"
    }
    filter { includeTestsMatching "*SecurityZapIT*" }
    shouldRunAfter tasks.named("test")
}

// Nuclei acceptance uses only an owned local HTTP fixture and a pre-pulled image.
tasks.register("securityNucleiTest", Test) {
    description = "Runs the pinned Nuclei header policy against an owned local sample"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines "junit-jupiter"; includeTags "nuclei" }
    filter { includeTestsMatching "*SecurityNucleiIT*" }
    outputs.upToDateWhen { false }
}

// testssl.sh acceptance: the pinned image must already be pulled (never downloaded implicitly).
// tls.testforge.test resolves to loopback for this JVM only, so the owned server's certificate name
// matches for both the JDK checks and the container.
tasks.register("securityTlsTest", Test) {
    description = "Runs the pinned testssl.sh container against an owned local HTTPS server"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines "junit-jupiter"; includeTags "testssl" }
    def hosts = layout.buildDirectory.file("testssl/hosts")
    doFirst {
        def file = hosts.get().asFile
        file.parentFile.mkdirs()
        file.text = "127.0.0.1 tls.testforge.test\n"
        systemProperty "jdk.net.hosts.file", file.absolutePath
    }
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named("test")
}

// Project-level load orchestration stays separate from production modules.
apply from: "gradle/load.gradle"

// Optional native front-end performance workflow.
apply from: "gradle/lighthouse.gradle"
// Optional OpenAPI security lint (Spectral + OWASP API Top 10), read by the quality gate as SARIF.
apply from: "gradle/spectral.gradle"
// Optional external surface inventory.
apply from: "gradle/external-surface.gradle"

// Explicit native axe acceptance; never run by the default build.
tasks.register("a11yTest", Test) {
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines "junit-jupiter"; includeTags "browser" }
    filter { includeTestsMatching "*A11yAxeIT*" }
    outputs.upToDateWhen { false }
}

// Only the new fault adapter acceptance, without unrelated Cucumber suites.
tasks.register("faultsTest", Test) {
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines "junit-jupiter"; includeTags "containers" }
    filter { includeTestsMatching "*FaultsToxiproxyIT*" }
    outputs.upToDateWhen { false }
}

// Mailpit is an explicitly requested, owned SMTP fixture, never a default build dependency.
tasks.register("mailTest", Test) {
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines "junit-jupiter"; includeTags "mail" }
    systemProperty "testforge.mailpit-image", "axllent/mailpit:v${libs.versions.mailpit.get()}"
    outputs.upToDateWhen { false }
}
