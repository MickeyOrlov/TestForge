# Environment profile TEMPLATE — copy to application-<env>.yml, fill in real
# endpoints and select with -DtestEnv=<env> (forwarded to forked test JVMs as
# spring.profiles.active).
#
# Secrets come from environment variables or a secret manager — NEVER commit
# them. Every placeholder below falls back to a harmless default so the file
# documents the full configuration surface.

spring:
  datasource:
    url: ${TESTENV_DB_URL:jdbc:postgresql://db.staging.example.test:5432/app}
    username: ${TESTENV_DB_USER:qa}
    password: ${TESTENV_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${TESTENV_KAFKA_BOOTSTRAP:kafka.staging.example.test:9092}
    consumer:
      group-id: testforge-probe
      auto-offset-reset: latest

forge:
  wait:
    timeout: 30s
    poll-interval: 500ms
  mock:
    base-url: ${TESTENV_WIREMOCK_URL:http://wiremock.staging.example.test:8080}
    # THE critical adaptation point: the request-body field that ties a
    # downstream call to one scenario (see module-mock/README.md)
    scope-json-path: "$.testScope"
  http:
    base-url: ${TESTENV_API_URL:https://api.staging.example.test}
    connect-timeout: 5s
    read-timeout: 30s
    # scope.json-path is intentionally absent: it follows forge.mock.scope-json-path
    correlation:
      header: X-Request-Id
    logging:
      bodies: true
      # extend with this product's own credential field names
      redact-json-fields: [password, secret, token, access_token, refresh_token]
    retry:
      enabled: false          # turn on only where infrastructure noise is real
  api-explorer:
    enabled: false            # sends real traffic — turn on per environment only
    output-dir: build/api-explorer
    methods: [GET, HEAD, OPTIONS]
    allow-unsafe-methods: false   # write methods need this AND the method listed
    # parameters:
    #   defaults:
    #     id: "00000000-0000-0000-0000-000000000001"
    fail-on:
      contract-mismatch: false  # review the first report before turning this on
      failure: true
  db:
    log-sql: true
    repository-polling:
      enabled: false
  kafka:
    enabled: false            # turn on only in profiles with broker access
    topics: []
    poll-timeout: 500ms
    max-messages-per-topic: 1000
    seek-to-beginning-on-start: false
  contract:
    fail-fast: false
    max-violations: 100
  data:
    max-template-depth: 10
  flow:
    timeout: 60s
    max-transitions: 100
    max-visits-per-state: 5
  reporting:
    resource-monitor:
      enabled: false
  prewarm:
    enabled: false
    urls: []
