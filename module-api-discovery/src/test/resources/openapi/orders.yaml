openapi: 3.0.3
info:
  title: Orders API
  version: 1.4.0
paths:
  /orders:
    # inherited by every operation under this path
    parameters:
      - $ref: '#/components/parameters/TenantHeader'
    get:
      operationId: getOrders
      summary: List orders
      tags: [orders]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
  /orders/{id}:
    get:
      operationId: getOrderById
      parameters:
        # deliberately omits "required" — the specification makes path
        # parameters mandatory anyway, and the builder must normalize it
        - name: id
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ok
    delete:
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: gone
  /legacy/ping:
    get:
      operationId: legacyPing
      deprecated: true
      responses:
        '200':
          description: ok
components:
  parameters:
    TenantHeader:
      name: X-Tenant
      in: header
      required: false
      schema:
        type: string
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
    OrderList:
      type: array
      items:
        $ref: '#/components/schemas/Order'
