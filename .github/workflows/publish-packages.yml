name: Publish Maven packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version, for example 1.2.0 or 1.2.0-beta.1
        required: true
        default: 1.2.0-beta.1

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-maven-${{ inputs.version }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Unsupported Maven version: $VERSION" >&2
            exit 1
          fi

      - name: Build and verify external consumer
        run: |
          ./gradlew --no-daemon build publishTestForgeLibraries \
            -PtestforgeGroup=io.github.mickeyorlov.testforge \
            -PtestforgeVersion="${{ inputs.version }}"
          ./gradlew --no-daemon -p smoke-tests/library-consumer test \
            -PtestforgeGroup=io.github.mickeyorlov.testforge \
            -PtestforgeVersion="${{ inputs.version }}"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon publishTestForgeLibraries \
            -PtestforgeGroup=io.github.mickeyorlov.testforge \
            -PtestforgeVersion="${{ inputs.version }}" \
            -PtestforgeRepositoryUrl=https://maven.pkg.github.com/mickeyorlov/TestForge
